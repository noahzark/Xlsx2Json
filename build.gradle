plugins {
    id 'java'
}

group = 'moe.imvery.utils'
version = '1.8'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/org.apache.poi/poi
    implementation 'org.apache.poi:poi:5.5.1'

    // https://mvnrepository.com/artifact/org.apache.poi/poi-ooxml
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // https://mvnrepository.com/artifact/org.json/json
    implementation 'org.json:json:20260814'

    // POI 5 logs through the Log4j API; without a provider it prints an error on every run
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'

    // https://mvnrepository.com/artifact/org.skyscreamer/jsonassert
    testImplementation('org.skyscreamer:jsonassert:1.5.3') {
        // android-json ships its own org.json classes, which would shadow the real org.json
        exclude group: 'com.vaadin.external.google', module: 'android-json'
    }

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('fatJar', Jar) {
    manifest {
        attributes 'Implementation-Title': 'Xlsx2Json',
                'Implementation-Version': project.version,
                'Main-Class': 'moe.imvery.utils.xlsx2json.ExcelParserMain'
    }
    archiveBaseName = project.name
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    with jar
}
