name: Release

# Publishes a GitHub release for the version in build.gradle, with the runnable jar attached
# and the matching CHANGELOG.md section as release notes. Run it from the Actions tab, or
# push a tag named v<version>.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check the release doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in build.gradle first."
            exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything under "## <version>" up to the next "## " heading
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No \"## $VERSION\" section in CHANGELOG.md"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Build and test
        run: ./gradlew build fatJar

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "build/libs/xlsx2json-$VERSION-all.jar" \
            --title "Xlsx2Json $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
