name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8 is the compile target; 17 and 21 are current LTS releases
        java: ['8', '17', '21']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Also validates the checksum of gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and package
        run: ./gradlew build fatJar

      - name: Smoke-test the fat jar
        run: |
          cp testcases/test.xlsx "$RUNNER_TEMP/smoke.xlsx"
          java -jar build/libs/xlsx2json-*-all.jar "$RUNNER_TEMP/smoke.xlsx" "map monster" true
          test -s "$RUNNER_TEMP/smoke.json"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports/tests/

      - name: Upload fat jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v7
        with:
          name: xlsx2json-jar
          path: build/libs/*-all.jar
